[project]
name = "rosmarium-ai-worker"
version = "1.1.0"
description = "AI pipeline worker for Rosmarium COS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.6",
    "uvicorn>=0.27.1",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "networkx>=3.4",
    "python-louvain>=0.16",
    "scipy>=1.14",
    "rdflib>=7.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-asyncpg>=0.63b1",
    "opentelemetry-instrumentation-redis>=0.63b1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.3",
    "openai>=1.57",
    "cohere>=5.11",
]
rag = [
    "spacy>=3.8",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.3",
    "llama-index-embeddings-openai>=0.3",
    "llama-index-postprocessor-cohere-rerank>=0.3",
    "transformers>=4.47",
    "torch>=2.5",
    "scikit-learn>=1.6",
    "numpy>=2.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN201", "ANN001"]
"src/rosmarium_ai_worker/vector/index_manager.py" = ["S608"]
"src/rosmarium_ai_worker/workers/embedding_worker.py" = ["N815"]
"src/rosmarium_ai_worker/config.py" = ["S105"]
"src/rosmarium_ai_worker/api/routes/search.py" = ["B008"]
"src/rosmarium_ai_worker/chunking/**/*.py" = ["ANN"]
"src/rosmarium_ai_worker/rag/**/*.py" = ["ANN"]
# Intelligence modules — camelCase fields for JSON wire compat, assert guards, parameterized table SQL
"src/rosmarium_ai_worker/intelligence/**/*.py" = ["N815", "S608", "S101"]
"src/rosmarium_ai_worker/api/routes/intelligence.py" = ["N815", "S608"]
"src/rosmarium_ai_worker/workers/intelligence_worker.py" = ["N815", "S608", "S101"]
"tests/test_ner.py" = ["E402", "S101"]
"tests/test_summarizer.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rosmarium_ai_worker"]
