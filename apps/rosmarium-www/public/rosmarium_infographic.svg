<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
    </style>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0" />
      <stop offset="100%" stop-color="#0B0D17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="rocketFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B0D17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanOnly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="purpleOnly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow"><feFuncA type="linear" slope="1.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="massiveBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow"><feFuncA type="linear" slope="1.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowIntense" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="glow"><feFuncA type="linear" slope="2"/></feComponentTransfer>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="dotCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#22D3EE" filter="url(#glowCyan)"/>
    </marker>
    <marker id="dotPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#A855F7" filter="url(#glowPurple)"/>
    </marker>
  </defs>

  <rect width="1200" height="1250" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 200 L 1200 200 M 0 400 L 1200 400 M 0 600 L 1200 600 M 0 800 L 1200 800 M 0 1000 L 1200 1000 M 0 1200 L 1200 1200" />
    <path d="M 200 0 L 200 1250 M 400 0 L 400 1250 M 600 0 L 600 1250 M 800 0 L 800 1250 M 1000 0 L 1000 1250" />
  </g>

  <!-- Title & Logo -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- True Rosmarium Logo embedded -->
    <g transform="translate(-100, -100) scale(0.6)">
        <rect x="20" y="20" width="160" height="160" rx="20" fill="#020617" stroke="url(#cyanPurple)" stroke-width="12" filter="url(#glowIntense)"/>
        <text x="40" y="55" font-family="'Inter', system-ui, monospace, sans-serif" font-size="24" font-weight="700" fill="#94A3B8">42</text>
        <text x="100" y="125" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="url(#cyanPurple)" text-anchor="middle" letter-spacing="-2">Ro</text>
        <text x="100" y="152" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">Rosmarium</text>
        <text x="100" y="170" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">284.14</text>
    </g>

    <text y="80" font-family="'Inter', system-ui, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="3">
      THE ROSMARIUM PLATFORM
    </text>
    <text y="120" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="1">
      Intelligent Content Orchestration at Enterprise Scale
    </text>
  </g>

  <!-- Connectors Base Lines -->
  <g stroke-width="3" fill="none">
    <!-- Layer 4 to Layer 3 (Data to Core) -->
    <!-- Postgres to COS -->
    <path d="M 350 950 C 350 890, 380 900, 380 840" stroke="#06B6D4" marker-start="url(#dotCyan)" marker-end="url(#dotCyan)" filter="url(#glowCyan)"/>
    <!-- Redis to COS -->
    <path d="M 600 950 C 600 890, 500 900, 500 840" stroke="#06B6D4" marker-start="url(#dotCyan)" marker-end="url(#dotCyan)" filter="url(#glowCyan)"/>
    <!-- Redis to AI Pipeline -->
    <path d="M 600 950 C 600 890, 700 900, 700 840" stroke="#A855F7" marker-start="url(#dotCyan)" marker-end="url(#dotPurple)" filter="url(#glowPurple)"/>
    <!-- MinIO to AI Pipeline -->
    <path d="M 850 950 C 850 890, 820 900, 820 840" stroke="#A855F7" marker-start="url(#dotPurple)" marker-end="url(#dotPurple)" filter="url(#glowPurple)"/>

    <!-- Layer 3 to Layer 2 (Core to API Gateway) -->
    <path d="M 430 680 C 430 620, 500 600, 500 540" stroke="#06B6D4" marker-start="url(#dotCyan)" marker-end="url(#dotCyan)" filter="url(#glowCyan)"/>
    <path d="M 770 680 C 770 620, 700 600, 700 540" stroke="#A855F7" marker-start="url(#dotPurple)" marker-end="url(#dotPurple)" filter="url(#glowPurple)"/>

    <!-- Layer 2 to Layer 1 (API Gateway to Consumption Layer) -->
    <!-- Standard APIs -->
    <path d="M 550 460 L 550 370" stroke="#22D3EE" marker-start="url(#dotCyan)" marker-end="url(#dotCyan)" filter="url(#glowCyan)"/>
    <!-- Agentic/LLM APIs -->
    <path d="M 650 460 L 650 370" stroke="#A855F7" marker-start="url(#dotPurple)" marker-end="url(#dotPurple)" filter="url(#glowPurple)"/>
  </g>

  <!-- LAYER 1: Omnichannel / Clients (Y: 270 - 350) -->
  <text x="600" y="235" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">OMNICHANNEL CONSUMPTION LAYER</text>
  <rect x="150" y="250" width="900" height="120" rx="24" fill="#0F172A" fill-opacity="0.5" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- Web -->
  <g transform="translate(180, 270)">
    <rect width="240" height="80" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#06B6D4" stroke-width="2"/>
    <text x="120" y="46" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web &amp; E-Commerce</text>
  </g>
  <!-- Native Apps -->
  <g transform="translate(480, 270)">
    <rect width="240" height="80" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#06B6D4" stroke-width="2"/>
    <text x="120" y="46" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Native (Flutter / iOS)</text>
  </g>
  <!-- AI Agents -->
  <g transform="translate(780, 270)">
    <rect width="240" height="80" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#A855F7" stroke-width="2"/>
    <text x="120" y="36" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI Agents &amp; MCP</text>
    <text x="120" y="60" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#C084FC" text-anchor="middle">Agentic Commerce</text>
  </g>

  <!-- LAYER 2: API Gateway (Y: 460 - 540) -->
  <g transform="translate(400, 460)">
    <rect width="400" height="80" rx="16" fill="#0B132B" fill-opacity="0.9" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glowIntense)"/>
    <text x="200" y="46" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="800" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">GLOBAL HEADLESS APIs</text>
    <text x="200" y="68" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">GraphQL • REST • Edge Cache</text>
  </g>

  <!-- LAYER 3: Core Orchestration (Y: 660 - 850) -->
  <!-- Border surrounding both core components -->
  <rect x="250" y="660" width="700" height="200" rx="24" fill="#0F172A" fill-opacity="0.5" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="600" y="645" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">CORE ORCHESTRATION LAYER</text>

  <g transform="translate(280, 680)">
    <rect width="300" height="160" rx="16" fill="#0B132B" stroke="#06B6D4" stroke-width="2"/>
    <text x="150" y="40" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#E2E8F0" text-anchor="middle">ROSMARIUM COS</text>
    <g font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#94A3B8" transform="translate(30, 80)">
      <text x="0" y="0">• Content Modeling Engine</text>
      <text x="0" y="30">• Visual Block Editor</text>
      <text x="0" y="60">• Workflow &amp; Compliance</text>
    </g>
  </g>

  <g transform="translate(620, 680)">
    <rect width="300" height="160" rx="16" fill="#0B132B" stroke="#A855F7" stroke-width="2"/>
    <text x="150" y="40" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#E2E8F0" text-anchor="middle">AI PIPELINE</text>
    <g font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#94A3B8" transform="translate(30, 80)">
      <text x="0" y="0">• Vector Embeddings (RAG)</text>
      <text x="0" y="30">• Automated Tagging (NER)</text>
      <text x="0" y="60">• Semantic Search Fusion</text>
    </g>
  </g>

  <!-- LAYER 4: Data Infrastructure (Y: 960 - 1060) -->
  <text x="600" y="930" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">DATA INFRASTRUCTURE</text>

  <!-- Subtle Rocket Thrust Flame (Behind Data Layer) -->
  <g filter="url(#massiveBlur)">
    <!-- Outer flame exhaust -->
    <path d="M 250 950 L 950 950 L 600 1250 Z" fill="url(#rocketFlame)"/>
    <!-- Inner hot core -->
    <path d="M 400 950 L 800 950 L 600 1150 Z" fill="#22D3EE" opacity="0.4"/>
  </g>

  <g transform="translate(250, 950)">
    <rect width="200" height="100" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">PostgreSQL</text>
    <text x="100" y="70" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#22D3EE" text-anchor="middle">+ pgvector</text>
  </g>

  <g transform="translate(500, 950)">
    <rect width="200" height="100" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Redis Cache</text>
    <text x="100" y="70" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#06B6D4" text-anchor="middle">+ BullMQ Jobs</text>
  </g>

  <g transform="translate(750, 950)">
    <rect width="200" height="100" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="2"/>
    <text x="100" y="45" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">MinIO (S3)</text>
    <text x="100" y="70" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#A855F7" text-anchor="middle">Object Storage</text>
  </g>

</svg>
