<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="600" fill="#0F172A" rx="16" />
  
  <!-- Title -->
  <text x="500" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" text-anchor="middle">Rosmarium COS Architecture</text>
  <text x="500" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="middle">AI-Native Split-Stack Infrastructure</text>

  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <linearGradient id="grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="grad-python" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Clients -->
  <g transform="translate(40, 200)">
    <rect width="140" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="70" y="35" font-family="system-ui" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">Clients</text>
    <text x="70" y="55" font-family="system-ui" font-size="12" fill="#94A3B8" text-anchor="middle">Admin UI / API</text>
  </g>

  <!-- Node.js Server -->
  <g transform="translate(280, 140)">
    <rect width="220" height="200" rx="12" fill="url(#grad-node)" fill-opacity="0.1" stroke="#10B981" stroke-width="2"/>
    <rect width="220" height="40" rx="12" fill="url(#grad-node)"/>
    <text x="110" y="25" font-family="system-ui" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">rosmarium-server</text>
    <text x="110" y="70" font-family="system-ui" font-size="14" font-weight="600" fill="#10B981" text-anchor="middle">Node.js / Fastify</text>
    
    <text x="30" y="105" font-family="system-ui" font-size="13" fill="#E2E8F0">• Content API (REST/GQL)</text>
    <text x="30" y="130" font-family="system-ui" font-size="13" fill="#E2E8F0">• Auth &amp; RBAC</text>
    <text x="30" y="155" font-family="system-ui" font-size="13" fill="#E2E8F0">• Webhooks Delivery</text>
    <text x="30" y="180" font-family="system-ui" font-size="13" fill="#E2E8F0">• Job Dispatch</text>
  </g>

  <!-- Python Worker -->
  <g transform="translate(700, 140)">
    <rect width="220" height="200" rx="12" fill="url(#grad-python)" fill-opacity="0.1" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="40" rx="12" fill="url(#grad-python)"/>
    <text x="110" y="25" font-family="system-ui" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">rosmarium-ai-worker</text>
    <text x="110" y="70" font-family="system-ui" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle">Python / FastAPI</text>
    
    <text x="30" y="105" font-family="system-ui" font-size="13" fill="#E2E8F0">• Embedding Engine (Ollama)</text>
    <text x="30" y="130" font-family="system-ui" font-size="13" fill="#E2E8F0">• Knowledge Graph Extraction</text>
    <text x="30" y="155" font-family="system-ui" font-size="13" fill="#E2E8F0">• NLP / NER (spaCy)</text>
    <text x="30" y="180" font-family="system-ui" font-size="13" fill="#E2E8F0">• Advanced RAG Pipeline</text>
  </g>

  <!-- Redis -->
  <g transform="translate(530, 190)">
    <rect width="140" height="100" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <text x="70" y="35" font-family="system-ui" font-size="16" font-weight="600" fill="#EF4444" text-anchor="middle">Redis (BullMQ)</text>
    <text x="70" y="60" font-family="system-ui" font-size="12" fill="#94A3B8" text-anchor="middle">Job Queue &amp;</text>
    <text x="70" y="80" font-family="system-ui" font-size="12" fill="#94A3B8" text-anchor="middle">Message Broker</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(430, 420)">
    <rect width="340" height="120" rx="12" fill="url(#grad-db)" fill-opacity="0.1" stroke="#64748B" stroke-width="2"/>
    <rect width="340" height="40" rx="12" fill="url(#grad-db)"/>
    <text x="170" y="25" font-family="system-ui" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">PostgreSQL 16</text>
    
    <rect x="30" y="60" width="130" height="40" rx="4" fill="#334155"/>
    <text x="95" y="85" font-family="system-ui" font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">JSONB Content</text>
    
    <rect x="180" y="60" width="130" height="40" rx="4" fill="#334155"/>
    <text x="245" y="85" font-family="system-ui" font-size="13" font-weight="500" fill="#E2E8F0" text-anchor="middle">pgvector Store</text>
  </g>

  <!-- Connectors -->
  <!-- Client to Node -->
  <path d="M 180 240 L 270 240" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Node to Redis -->
  <path d="M 500 240 L 520 240" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- Redis to Python -->
  <path d="M 670 240 L 690 240" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <!-- Node to Postgres -->
  <path d="M 390 340 L 390 390 L 460 390 L 460 410" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- Python to Postgres -->
  <path d="M 810 340 L 810 390 L 740 390 L 740 410" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
</svg>
