<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0F172A" rx="12"/>

  <!-- Admin Editor Box -->
  <rect x="50" y="80" width="250" height="240" rx="8" fill="#1E293B" stroke="url(#purpleGrad)" stroke-width="2"/>
  <text x="175" y="110" font-family="system-ui" font-size="18" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Rosmarium Admin</text>
  <rect x="70" y="130" width="210" height="40" rx="4" fill="#334155"/>
  <text x="175" y="155" font-family="system-ui" font-size="14" fill="#CBD5E1" text-anchor="middle">Block Editor</text>
  <rect x="70" y="180" width="210" height="120" rx="4" fill="#334155"/>
  <text x="175" y="240" font-family="system-ui" font-size="14" fill="#94A3B8" text-anchor="middle">Typing content...</text>

  <!-- Frontend Box -->
  <rect x="500" y="80" width="250" height="240" rx="8" fill="#1E293B" stroke="url(#cyanGrad)" stroke-width="2"/>
  <text x="625" y="110" font-family="system-ui" font-size="18" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Your Frontend</text>
  <rect x="520" y="130" width="210" height="170" rx="4" fill="#334155"/>
  <text x="625" y="180" font-family="system-ui" font-size="14" fill="#CBD5E1" text-anchor="middle">React / Vue / Astro</text>
  <text x="625" y="240" font-family="system-ui" font-size="14" fill="#22D3EE" font-weight="bold" text-anchor="middle">Live Rendering</text>

  <!-- Communication Arrows -->
  <path d="M 310 180 L 490 180" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowHead)"/>
  <text x="400" y="170" font-family="system-ui" font-size="14" fill="#94A3B8" text-anchor="middle">postMessage()</text>

  <path d="M 310 240 L 490 240" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowHead)"/>
  <text x="400" y="230" font-family="system-ui" font-size="14" fill="#94A3B8" text-anchor="middle">JSON Diff</text>

</svg>
