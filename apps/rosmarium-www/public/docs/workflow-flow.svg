<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="draftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="publishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#0F172A" rx="12"/>

  <!-- States -->
  <!-- Draft -->
  <rect x="50" y="150" width="150" height="80" rx="8" fill="url(#draftGrad)" stroke="#94A3B8" stroke-width="2"/>
  <text x="125" y="195" font-family="system-ui" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Draft</text>

  <!-- In Review -->
  <rect x="325" y="150" width="150" height="80" rx="8" fill="url(#reviewGrad)" stroke="#FCD34D" stroke-width="2"/>
  <text x="400" y="195" font-family="system-ui" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">In Review</text>

  <!-- Published -->
  <rect x="600" y="150" width="150" height="80" rx="8" fill="url(#publishGrad)" stroke="#34D399" stroke-width="2"/>
  <text x="675" y="195" font-family="system-ui" font-size="16" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Published</text>

  <!-- Transitions -->
  <!-- Draft to Review -->
  <path d="M 200 175 L 315 175" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrowSolid)"/>
  <text x="257" y="165" font-family="system-ui" font-size="12" fill="#94A3B8" text-anchor="middle">Submit</text>

  <!-- Review to Draft (Reject) -->
  <path d="M 325 205 L 210 205" stroke="#F87171" stroke-width="3" stroke-dasharray="4" marker-end="url(#arrowSolid)"/>
  <text x="267" y="225" font-family="system-ui" font-size="12" fill="#F87171" text-anchor="middle">Reject (Comment)</text>

  <!-- Review to Publish -->
  <path d="M 475 190 L 590 190" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrowSolid)"/>
  <text x="532" y="180" font-family="system-ui" font-size="12" fill="#94A3B8" text-anchor="middle">Approve</text>
  
  <!-- Role Constraints -->
  <rect x="50" y="240" width="150" height="24" rx="4" fill="#1E293B"/>
  <text x="125" y="256" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Role: Editor</text>

  <rect x="325" y="240" width="150" height="24" rx="4" fill="#1E293B"/>
  <text x="400" y="256" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Role: Reviewer / Legal</text>

  <rect x="600" y="240" width="150" height="24" rx="4" fill="#1E293B"/>
  <text x="675" y="256" font-family="system-ui" font-size="10" fill="#94A3B8" text-anchor="middle">Role: Publisher</text>

  <!-- Title -->
  <text x="400" y="60" font-family="system-ui" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Enterprise Workflow Engine</text>
  <text x="400" y="85" font-family="system-ui" font-size="14" fill="#94A3B8" text-anchor="middle">Visual state machine with role-based transitions</text>
</svg>
