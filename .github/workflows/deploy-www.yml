name: Deploy Rosmarium Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'apps/rosmarium-www/**'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm --filter rosmarium-www build

      - name: Create Cloudflare Pages Project & Bind Domain
        run: |
          npx wrangler pages project create rosmarium --production-branch main || true
          npx wrangler pages domain add rosmarium.com --project-name rosmarium || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'rosmarium'
          directory: 'apps/rosmarium-www/dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Purge Cloudflare Cache
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=rosmarium.com" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id')
          if [ "$ZONE_ID" != "null" ] && [ -n "$ZONE_ID" ]; then
            echo "Purging cache for zone $ZONE_ID"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          else
            echo "Could not find zone ID"
          fi
