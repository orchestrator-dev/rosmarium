name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  server:
    name: cortex-server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Enable pgvector
        run: |
          PGPASSWORD=cortex psql -h localhost -U cortex -d cortex_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Typecheck
        run: pnpm --filter @cortex-cms/server typecheck
      - name: Lint
        run: pnpm --filter @cortex-cms/server lint
      - name: Test
        run: pnpm --filter @cortex-cms/server test --coverage
        env:
          DATABASE_URL: postgresql://cortex:cortex@localhost:5432/cortex_test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test
          AI_WORKER_URL: http://localhost:8001
          AI_WORKER_SECRET: test-secret
          STORAGE_PROVIDER: minio
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET: cortex-test
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: test
          STORAGE_SECRET_KEY: test

  ai-worker:
    name: cortex-ai-worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        working-directory: apps/cortex-ai-worker
        run: uv sync --all-extras
      - name: Typecheck (mypy)
        working-directory: apps/cortex-ai-worker
        run: uv run mypy src/
      - name: Lint (ruff)
        working-directory: apps/cortex-ai-worker
        run: uv run ruff check src/ tests/
      - name: Test
        working-directory: apps/cortex-ai-worker
        run: uv run pytest --cov=src --cov-report=xml
        env:
          DATABASE_URL: postgresql://cortex:cortex@localhost:5432/cortex_test
          REDIS_URL: redis://localhost:6379
          EMBEDDING_PROVIDER: ollama
          EMBEDDING_MODEL: nomic-embed-text
          OLLAMA_BASE_URL: http://localhost:11434
          WORKER_SECRET: test-secret
          ENVIRONMENT: test

  admin:
    name: cortex-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @cortex-cms/admin typecheck
      - name: Lint
        run: pnpm --filter @cortex-cms/admin lint
      - name: Test
        run: pnpm --filter @cortex-cms/admin test
      - name: Build
        run: pnpm --filter @cortex-cms/admin build
