services:
  postgres:
    container_name: rosmarium-postgres
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rosmarium
      POSTGRES_PASSWORD: rosmarium
      POSTGRES_DB: rosmarium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rosmarium -d rosmarium" ]
      interval: "5s"
      timeout: "5s"
      retries: 5

  pgvector-init:
    container_name: rosmarium-pgvector-init
    profiles: [ "init" ]
    image: docker.io/pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      psql postgresql://rosmarium:rosmarium@rosmarium-postgres:5432/rosmarium  -c "CREATE EXTENSION IF NOT EXISTS vector;"

  redis:
    container_name: rosmarium-redis
    image: docker.io/library/redis:7-alpine
    command: redis-server --appendonly yes --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: "5s"
      timeout: "5s"
      retries: 5

  minio:
    container_name: rosmarium-minio
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rosmarium
      MINIO_ROOT_PASSWORD: rosmarium_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: "5s"
      timeout: "5s"
      retries: 5

  minio-init:
    container_name: rosmarium-minio-init
    profiles: [ "init" ]
    image: docker.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set rosmarium-local http://rosmarium-minio:9000 rosmarium rosmarium_secret; mc mb rosmarium-local/rosmarium-assets --ignore-existing; mc anonymous set download rosmarium-local/rosmarium-assets; "

  rosmarium-ai-worker:
    container_name: rosmarium-ai-worker
    build:
      context: ./apps/rosmarium-ai-worker
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://rosmarium:rosmarium@rosmarium-postgres:5432/rosmarium
      REDIS_URL: redis://rosmarium-redis:6379
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WORKER_SECRET: ${AI_WORKER_SECRET:-change-this-in-production}
      ENVIRONMENT: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "15s"

  grafana:
    image: docker.io/grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning/dashboards:z
      - ./deploy/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:z
    profiles: ["observability"]

  prometheus:
    image: docker.io/prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:z
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
