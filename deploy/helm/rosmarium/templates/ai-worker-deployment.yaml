apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rosmarium.fullname" . }}-ai-worker
  labels:
    {{- include "rosmarium.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-worker
spec:
  {{- if not .Values.aiWorker.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount.aiWorker }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rosmarium.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ai-worker
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rosmarium.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ai-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-ai-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}/rosmarium-ai-worker:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "rosmarium.fullname" . }}-config
          env:
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: EMBEDDING_PROVIDER
              value: {{ .Values.config.embeddingProvider | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.config.embeddingModel | quote }}
            - name: WORKER_SECRET
              value: {{ .Values.config.workerSecret | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.config.nodeEnv | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.aiWorker.probes.liveness.path | default "/health" }}
              port: 8001
          readinessProbe:
            httpGet:
              path: {{ .Values.aiWorker.probes.readiness.path | default "/health" }}
              port: 8001
            initialDelaySeconds: {{ .Values.aiWorker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.aiWorker.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.aiWorker.resources | nindent 12 }}
