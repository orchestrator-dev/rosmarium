<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <!-- Periodic Table Element Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- UI Effects -->
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Rosemary Leaf Template (Origin at Base 0,0) -->
    <g id="rosemary-leaf">
      <!-- Edge Paths (Blades) -->
      <path d="M 120 -200 L 100 -180 L 60 -140 L 20 -90 L -10 -40 L 0 0" stroke="#A855F7" stroke-width="2" stroke-opacity="0.4" fill="none"/>
      <path d="M 120 -200 L 130 -160 L 100 -110 L 60 -60 L 30 -20 L 0 0" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4" fill="none"/>
      
      <!-- Central Vein -->
      <path d="M 120 -200 L 90 -150 L 60 -100 L 30 -50 L 0 0" stroke="#22D3EE" stroke-width="3" stroke-opacity="0.6" fill="none"/>

      <!-- Cross Connections (Veins) -->
      <path d="M 90 -150 L 100 -180 M 60 -100 L 60 -140 M 30 -50 L 20 -90 M 90 -150 L 130 -160 M 60 -100 L 100 -110 M 30 -50 L 60 -60 M 60 -140 L 100 -180 M 60 -140 L 20 -90 M 100 -110 L 130 -160 M 100 -110 L 60 -60" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
      
      <!-- Central Vein Nodes -->
      <circle cx="120" cy="-200" r="6" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="90" cy="-150" r="10" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="60" cy="-100" r="12" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="30" cy="-50" r="10" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="6" fill="#22D3EE" filter="url(#glow)"/>

      <!-- Left Blade Nodes -->
      <circle cx="100" cy="-180" r="5" fill="#A855F7" filter="url(#glow)"/>
      <circle cx="60" cy="-140" r="8" fill="#A855F7" filter="url(#glow)"/>
      <circle cx="20" cy="-90" r="7" fill="#A855F7" filter="url(#glow)"/>
      <circle cx="-10" cy="-40" r="5" fill="#A855F7" filter="url(#glow)"/>

      <!-- Right Blade Nodes -->
      <circle cx="130" cy="-160" r="5" fill="#3B82F6" filter="url(#glow)"/>
      <circle cx="100" cy="-110" r="8" fill="#3B82F6" filter="url(#glow)"/>
      <circle cx="60" cy="-60" r="7" fill="#3B82F6" filter="url(#glow)"/>
      <circle cx="30" cy="-20" r="5" fill="#3B82F6" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1">
    <path d="M0,50 L1200,50 M0,100 L1200,100 M0,150 L1200,150 M0,200 L1200,200 M0,250 L1200,250 M0,300 L1200,300 M0,350 L1200,350"/>
    <path d="M100,0 L100,400 M200,0 L200,400 M300,0 L300,400 M400,0 L400,400 M500,0 L500,400 M600,0 L600,400 M700,0 L700,400 M800,0 L800,400 M900,0 L900,400 M1000,0 L1000,400 M1100,0 L1100,400"/>
  </g>

  <!-- Periodic Table Logo -->
  <g transform="translate(100, 100) scale(1)">
    <rect x="20" y="20" width="160" height="160" rx="20" fill="#020617" stroke="url(#borderGrad)" stroke-width="12" filter="url(#neon)"/>
    <text x="40" y="55" font-family="system-ui, monospace, sans-serif" font-size="24" font-weight="700" fill="#94A3B8">42</text>
    <text x="100" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">Ro</text>
    <text x="100" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">Rosmarium</text>
    <text x="100" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">284.15</text>
  </g>

  <!-- Typography -->
  <text x="320" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">ROSMARIUM</text>
  
  <!-- "COS" Badge (Superscript) -->
  <rect x="800" y="110" width="76" height="38" rx="8" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-width="2"/>
  <text x="838" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#22D3EE" text-anchor="middle">COS</text>

  <!-- Tagline -->
  <text x="325" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#94A3B8" letter-spacing="1.5">The <tspan fill="#22D3EE" font-weight="600">AI-Native</tspan> Content Infrastructure</text>

  <!-- Badges -->
  <g transform="translate(325, 300)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    <!-- Row 1 -->
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
    <text x="55" y="19" text-anchor="middle" fill="#E9D5FF">Generative AI</text>

    <rect x="120" y="0" width="130" height="28" rx="6" fill="#0F172A" stroke="#22D3EE" stroke-width="1"/>
    <text x="185" y="19" text-anchor="middle" fill="#CFFAFE">Semantic Search</text>

    <rect x="260" y="0" width="130" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="325" y="19" text-anchor="middle">Knowledge Graph</text>

    <rect x="400" y="0" width="130" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="465" y="19" text-anchor="middle">Visual Workflows</text>

    <!-- Row 2 -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="146" height="28" rx="6" fill="#1E1B4B" stroke="#A855F7" stroke-width="1"/>
      <text x="73" y="19" text-anchor="middle" fill="#E9D5FF">Content Branching</text>

      <rect x="156" y="0" width="150" height="28" rx="6" fill="#083344" stroke="#22D3EE" stroke-width="1"/>
      <text x="231" y="19" text-anchor="middle" fill="#CFFAFE">Visual Live Preview</text>

      <rect x="316" y="0" width="130" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="381" y="19" text-anchor="middle">Enterprise RBAC</text>
    </g>
  </g>

  <!-- Sci-Fi Rosemary Sprig -->
  <g transform="translate(895, 75) scale(0.75)">
    
    <!-- Central Stem (The branch) -->
    <path d="M 50 300 Q 150 200 250 60" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.3" filter="url(#glow)" fill="none" stroke-linecap="round"/>
    
    <!-- Nodes on the main stem -->
    <circle cx="250" cy="60" r="4" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="200" cy="120" r="6" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="150" cy="180" r="8" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="100" cy="240" r="10" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="50" cy="300" r="6" fill="#22D3EE" filter="url(#glow)"/>
    
    <!-- Tip Leaves -->
    <use href="#rosemary-leaf" transform="translate(250, 60) rotate(-15) scale(0.3)" opacity="0.9"/>
    <use href="#rosemary-leaf" transform="translate(250, 60) rotate(15) scale(0.35)" opacity="0.9"/>
    <use href="#rosemary-leaf" transform="translate(250, 60) rotate(-45) scale(0.25)" opacity="1"/>
    
    <!-- Pair 1 (Near tip) -->
    <use href="#rosemary-leaf" transform="translate(200, 120) rotate(-35) scale(0.5)" opacity="0.85"/>
    <use href="#rosemary-leaf" transform="translate(200, 120) rotate(35) scale(0.55)" opacity="0.85"/>

    <!-- Pair 2 (Middle) -->
    <use href="#rosemary-leaf" transform="translate(150, 180) rotate(-45) scale(0.7)" opacity="0.8"/>
    <use href="#rosemary-leaf" transform="translate(150, 180) rotate(50) scale(0.7)" opacity="0.8"/>
    <use href="#rosemary-leaf" transform="translate(150, 180) rotate(5) scale(0.65)" opacity="0.7"/>

    <!-- Pair 3 (Lower) -->
    <use href="#rosemary-leaf" transform="translate(100, 240) rotate(-55) scale(0.85)" opacity="0.75"/>
    <use href="#rosemary-leaf" transform="translate(100, 240) rotate(65) scale(0.85)" opacity="0.75"/>
    
    <!-- Base Leaf -->
    <use href="#rosemary-leaf" transform="translate(50, 300) rotate(-65) scale(1)" opacity="0.6"/>
    <use href="#rosemary-leaf" transform="translate(50, 300) rotate(75) scale(1)" opacity="0.6"/>
    <use href="#rosemary-leaf" transform="translate(50, 300) rotate(0) scale(0.8)" opacity="0.5"/>
  </g>
</svg>
